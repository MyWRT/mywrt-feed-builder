# Packages synced into MyWRT/mywrt-feed-sources as <category>/<name>/.
#
#   name      package directory name; must be unique across categories
#   category  top-level directory in the sources repository
#   repo      upstream git repository
#   branch    optional; default branch when omitted
#   path      optional; directory inside the repository, default "."
#
# Fixes to upstream packages go in local-patches/<feed|source>/<name>/.

